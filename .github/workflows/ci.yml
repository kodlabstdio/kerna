name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true
      # Astro projects only type-check after their types are generated.
      - run: vp run -r sync
      - run: vp check
      - run: vp run design:lint
      - run: vp run --filter @kodlab/kerna-components typecheck
      # core's test script enforces the 80% coverage threshold.
      - run: vp run -r test
      - run: vp run -r build
