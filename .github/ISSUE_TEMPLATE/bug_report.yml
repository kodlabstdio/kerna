name: Bug report
description: Report a reproducible problem in the development version of Kerna.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Report security vulnerabilities privately through SECURITY.md. Kerna is in early development.
  - type: input
    id: version
    attributes:
      label: Commit and environment
      description: Kerna commit, EmDash, Node and browser versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal example or exact steps. Remove credentials and private content.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
